                      ))}

          {tab === 'list' && (
            <div className="stripe-card bg-white overflow-hidden">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 border-b text-slate-600 font-bold">
                  <tr><th className="p-3.5">작업명</th><th className="p-3.5">담당자</th><th className="p-3.5">상태</th><th className="p-3.5">마감일</th></tr>
                </thead>
                <tbody className="divide-y divide-slate-100 font-medium">
                  {tasks.map(t => (
                    <tr key={t.id} className="hover:bg-slate-50">
                      <td className="p-3.5 font-bold text-slate-900">{t.title}</td>
                      <td className="p-3.5">👤 {t.assigneeName}</td>
                      <td className="p-3.5"><span className="px-2 py-0.5 bg-slate-100 rounded text-slate-700 font-bold">{t.status.toUpperCase()}</span></td>
                      <td className="p-3.5 text-slate-500">{t.deadline}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {tab === 'overview' && (
            <div className="grid grid-cols-2 gap-6">
              <div className="stripe-card p-5 space-y-3">
                <h3 className="font-bold text-xs text-slate-900">팀원 목록 ({project.members.length}명)</h3>
                {project.members.map(m => (
                  <div key={m.id} className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center text-xs">
                    <div><p className="font-bold text-slate-900">{m.name}</p><p className="text-[11px] text-slate-500">{m.role}</p></div>
                    <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">할당 2건</span>
                  </div>
                ))}
              </div>
              <div className="stripe-card p-5 space-y-3">
                <h3 className="font-bold text-xs text-slate-900">과제 핵심 요구사항 체크</h3>
                <div className="p-3 bg-emerald-50 rounded-xl text-xs font-medium text-emerald-950">✓ NCM vs LFP 원가 비교 및 기술 한계 극복 솔루션 포함 필수</div>
                <div className="p-3 bg-amber-50 rounded-xl text-xs font-medium text-amber-950">⚠️ 참고문헌 7편 이상 인용 필수</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- View 4: Resources & AI Synthesis ---
    function ResourcesView({ resources, synthesis, showToast }) {
      const [tab, setTab] = useState('all');

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h1 className="text-xl font-black text-slate-900">📁 팀원 자료 관리 & AI 종합 정리</h1>
              <p className="text-xs text-slate-600 mt-1">팀원들이 수집한 PDF, 논문을 분석하여 중복을 감지하고 최적의 목차로 유기적으로 연결합니다.</p>
            </div>
            <button onClick={() => showToast('자료 업로드', '새 논문 자료가 등록되었습니다.')} className="stripe-pill-btn">
              + 새 자료 업로드
            </button>
          </div>

          {/* Duplicate Alert Banner */}
          <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-950 space-y-1">
            <p className="font-bold text-amber-900">⚠️ AI 중복 자료 발견 알림</p>
            <p>{synthesis.duplicates[0].reason}</p>
            <p className="text-emerald-800 bg-emerald-50 p-2 rounded-xl border border-emerald-200 mt-1 font-bold">
              💡 AI 권장 분담: {synthesis.duplicates[0].suggestion}
            </p>
          </div>

          <div className="flex gap-2 border-b pb-2">
            <button onClick={() => setTab('all')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold ${tab === 'all' ? 'bg-slate-900 text-white' : 'text-slate-700 hover:bg-slate-100'}`}>자료 목록 ({resources.length})</button>
            <button onClick={() => setTab('outline')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold ${tab === 'outline' ? 'bg-slate-900 text-white' : 'text-slate-700 hover:bg-slate-100'}`}>AI 추천 목차 (4단계)</button>
            <button onClick={() => setTab('links')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold ${tab === 'links' ? 'bg-slate-900 text-white' : 'text-slate-700 hover:bg-slate-100'}`}>자료 연결 매핑</button>
          </div>

          {tab === 'all' && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              {resources.map(r => (
                <div key={r.id} className="stripe-card p-5 flex flex-col justify-between hover:border-emerald-400">
                  <div>
                    <span className="text-[10px] font-bold px-2 py-0.5 bg-slate-100 rounded text-slate-800 uppercase">{r.fileType} · {r.fileSize}</span>
                    <h3 className="font-bold text-sm text-slate-900 mt-2 leading-snug">{r.title}</h3>
                    <p className="text-[11px] text-slate-500 mt-0.5">업로더: <strong className="text-slate-700">{r.uploaderName}</strong> · {r.uploadDate}</p>
                    <div className="p-3 bg-slate-50 rounded-xl mt-3 text-xs text-slate-800 leading-relaxed font-medium">
                      <span className="font-bold text-slate-500 text-[10px] block uppercase mb-1">AI 핵심 요약</span>
                      {r.summary}
                    </div>
                    <div className="mt-2.5 flex flex-wrap gap-1">
                      {r.keywords.map((k, i) => <span key={i} className="text-[10px] font-bold px-2 py-0.5 bg-emerald-50 text-emerald-800 rounded">#{k}</span>)}
                    </div>
                  </div>
                  <div className="mt-4 pt-3 border-t border-slate-100 text-[11px] text-emerald-700 font-bold">
                    추천 챕터: {r.matchedSection}
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === 'outline' && (
            <div className="stripe-card p-6 space-y-3">
              <h3 className="font-bold text-sm text-slate-900 mb-3">업로드된 모든 자료를 종합한 4단계 보고서/발표 구조</h3>
              {synthesis.outline.map((item, idx) => (
                <div key={idx} className="p-4 bg-slate-50 rounded-2xl border flex justify-between items-center text-xs">
                  <div>
                    <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">{item.chapter}</span>
                    <h4 className="font-bold text-xs text-slate-900 mt-1">{item.title}</h4>
                  </div>
                  <span className="text-[11px] font-bold text-slate-600 bg-white border px-2.5 py-1 rounded-lg">참조: {item.src}</span>
                </div>
              ))}
            </div>
          )}

          {tab === 'links' && (
            <div className="stripe-card p-6 space-y-3">
              <h3 className="font-bold text-sm text-slate-900 mb-3">자료 간 유기적 연결 매핑 (Cross-Resource Linkages)</h3>
              {synthesis.linkages.map((link, idx) => (
                <div key={idx} className="p-4 bg-slate-50 rounded-2xl border text-xs space-y-1">
                  <p className="font-bold text-slate-900">{link.title}</p>
                  <p className="text-emerald-700 font-bold">➡️ 추천 배치: {link.section}</p>
                  <p className="text-slate-600">{link.role}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- View 5: Project AI Assistant ---
    function AssistantView({ project, resources }) {
      const [messages, setMessages] = useState([
        { sender: 'ai', text: `안녕하세요 이예서님! [${project.title}] 프로젝트 AI 튜터입니다. 업로드된 자료 3건과 과제 지침을 기반으로 무엇이든 질문하세요.` }
      ]);
      const [input, setInput] = useState('');

      const send = (q) => {
        const query = q || input;
        if (!query.trim()) return;
        const newMsgs = [...messages, { sender: 'user', text: query }];
        setMessages(newMsgs);
        setInput('');

        setTimeout(() => {
          setMessages([...newMsgs, {
            sender: 'ai',
            text: `업로드된 [${resources.map(r => r.title).join(', ')}] 자료를 분석한 결과, 서론의 문제 정의와 본론의 하이니켈 열화 메커니즘 분석이 매우 우수합니다.\n\n추가로 폐배터리 리사이클링 및 2026 완성차 양산 적용 사례를 1~2문장 보강하시면 A+ 과제가 됩니다.`
          }]);
        }, 500);
      };

      return (
        <div className="space-y-4">
          <h1 className="text-xl font-black text-slate-900">🤖 프로젝트 전용 AI 어시스턴트</h1>
          <div className="stripe-card p-5 h-[420px] overflow-y-auto space-y-3">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`p-4 rounded-2xl max-w-xl text-xs leading-relaxed ${m.sender === 'user' ? 'bg-slate-900 text-white font-medium shadow-xs' : 'bg-slate-100 text-slate-900 font-medium'}`}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          <div className="flex gap-2 overflow-x-auto py-1 text-xs">
            <span className="text-[11px] font-bold text-slate-500 shrink-0">💡 빠른 질문:</span>
            {['우리 프로젝트에서 어떤 내용을 더 조사해야 할까?', '팀원들이 조사한 내용을 합쳐서 발표 구조를 만들어줘.'].map((qp, i) => (
              <button key={i} onClick={() => send(qp)} className="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-full font-bold text-slate-700 text-[11px] shrink-0 border">
                {qp}
              </button>
            ))}
          </div>

          <div className="flex gap-2">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="과제에 관해 무엇이든 물어보세요..." className="flex-1 p-3 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-emerald-500" />
            <button onClick={() => send()} className="stripe-pill-btn">전송</button>
          </div>
        </div>
      );
    }

    // --- View 6: Presentation Prep ---
    function PresentationView({ deck, setDeck, onNavigate, showToast, activeProj }) {
      const [editingNum, setEditingNum] = useState(null);
      const [editScript, setEditScript] = useState('');

      const saveEdit = (slideNumber) => {
        setDeck({
          ...deck,
          slides: deck.slides.map(s => s.slideNumber === slideNumber ? { ...s, script: editScript } : s)
        });
        setEditingNum(null);
        showToast('대본 수정', '대본이 저장되었습니다.');
      };

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h1 className="text-xl font-black text-slate-900">🎤 발표 준비 & 슬라이드별 대본 생성</h1>
              <p className="text-xs text-slate-600 mt-1">총 예상 발표 시간: <strong>7분 15초</strong> (총 6개 슬라이드)</p>
            </div>
            <button onClick={() => onNavigate('practice')} className="stripe-pill-btn">
              🏆 AI 실전 발표 연습실 입장 ➔
            </button>
          </div>

          <div className="space-y-4">
            {deck.slides.map(s => (
              <div key={s.slideNumber} className="stripe-card p-5 space-y-3 hover:border-emerald-400">
                <div className="flex justify-between items-center border-b pb-2">
                  <span className="text-xs font-black bg-slate-900 text-white px-2.5 py-1 rounded-lg">Slide {s.slideNumber} - {s.slideTitle}</span>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-slate-600">발표자: <strong>{s.speakerName}</strong></span>
                    <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200">⏱ {s.estimatedSeconds}초</span>
                  </div>
                </div>

                <div className="flex gap-1.5">
                  {s.keyPoints.map((kp, i) => <span key={i} className="text-[10px] font-bold px-2 py-0.5 bg-slate-100 rounded text-slate-700">• {kp}</span>)}
                </div>

                {editingNum === s.slideNumber ? (
                  <div className="space-y-2">
                    <textarea rows={3} value={editScript} onChange={(e) => setEditScript(e.target.value)} className="w-full p-3 bg-slate-50 border border-emerald-500 rounded-xl text-xs" />
                    <div className="flex justify-end gap-2">
                      <button onClick={() => setEditingNum(null)} className="px-3 py-1 text-xs text-slate-600">취소</button>
                      <button onClick={() => saveEdit(s.slideNumber)} className="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs font-bold">저장</button>
                    </div>
                  </div>
                ) : (
                  <div className="p-3.5 bg-slate-50 rounded-2xl border text-xs text-slate-800 font-medium leading-relaxed flex justify-between items-start">
                    <p>"{s.script}"</p>
                    <button onClick={() => { setEditingNum(s.slideNumber); setEditScript(s.script); }} className="text-[11px] text-emerald-700 hover:underline font-bold shrink-0 ml-3">대본 수정</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- View 7: AI Practice & Evaluation ---
    function PracticeView({ deck, showToast }) {
      const [mode, setMode] = useState('professor');
      const [slideIdx, setSlideIdx] = useState(0);
      const [showModal, setShowModal] = useState(false);
      const [ans, setAns] = useState('');
      const current = deck.slides[slideIdx];

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h1 className="text-xl font-black text-slate-900">🏆 AI 실전 발표 연습 & 6대 지표 평가</h1>
              <p className="text-xs text-slate-600 mt-1">교수님 질문 모드로 발표를 시뮬레이션하고 맞춤형 평가 리포트를 받아보세요.</p>
            </div>
            <button onClick={() => { setShowModal(true); confetti(); }} className="stripe-pill-btn">
              발표 완료 및 AI 평가 보기
            </button>
          </div>

          <div className="flex gap-2 p-1.5 bg-slate-100 rounded-2xl">
            {['professor', 'tough', 'team', 'general'].map(m => (
              <button key={m} onClick={() => setMode(m)} className={`px-4 py-2 rounded-xl text-xs font-bold ${mode === m ? 'bg-white text-emerald-900 shadow-xs border' : 'text-slate-600'}`}>
                {m === 'professor' ? '👨‍🏫 교수님 질문 모드' : m === 'tough' ? '⚡ 까다로운 질문 모드' : m === 'team' ? '👥 팀 발표 모드' : '🎯 일반 발표 연습'}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 stripe-card p-6 space-y-4">
              <div className="flex justify-between items-center border-b pb-2 text-xs font-bold">
                <span className="bg-slate-900 text-white px-2 py-0.5 rounded">Slide {current.slideNumber} / {deck.slides.length}</span>
                <span className="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">권장 시간: {current.estimatedSeconds}초</span>
              </div>
              <h2 className="text-lg font-black text-slate-900">{current.slideTitle}</h2>
              <div className="p-4 bg-slate-50 rounded-2xl border text-xs text-slate-800 font-medium leading-relaxed">
                "{current.script}"
              </div>
              <div className="flex justify-between pt-4">
                <button disabled={slideIdx === 0} onClick={() => setSlideIdx(slideIdx - 1)} className="px-3.5 py-1.5 rounded-xl border text-xs font-bold">이전</button>
                <button disabled={slideIdx === deck.slides.length - 1} onClick={() => setSlideIdx(slideIdx + 1)} className="px-3.5 py-1.5 rounded-xl border text-xs font-bold">다음</button>
              </div>
            </div>

            <div className="lg:col-span-5 stripe-card p-6 space-y-3">
              <span className="text-xs font-bold px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded">👨‍🏫 교수님 돌발 질문</span>
              <div className="p-3.5 bg-indigo-50 rounded-xl text-xs text-indigo-950 font-bold leading-relaxed">
                "Zr 도핑 시 300사이클 수명 유지율 89.2%를 달성했다고 하셨는데, 실제 대량 양산 공정에서의 단가 상승 요인은 어떻게 고려하셨나요?"
              </div>
              <textarea rows={4} value={ans} onChange={(e) => setAns(e.target.value)} placeholder="답변을 입력하거나 말씀하세요..." className="w-full p-3 bg-slate-50 border rounded-xl text-xs" />
              <button onClick={() => { setAns(''); showToast('답변 기록', '답변이 기록되었습니다.'); }} className="stripe-pill-btn w-full justify-center">답변 제출</button>
            </div>
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white rounded-3xl p-7 max-w-lg w-full space-y-4 shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center pb-2 border-b">
                  <h3 className="text-lg font-black text-slate-900">🎉 AI 발표 다면 평가 리포트</h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>
                <div className="p-4 bg-emerald-50 rounded-2xl text-xs font-extrabold text-emerald-900 flex justify-between items-center border border-emerald-200">
                  <span>종합 발표 준비도</span>
                  <span className="text-2xl font-black text-emerald-700">88% (A+ 우수)</span>
                </div>
                <div className="space-y-2 text-xs">
                  <div className="p-3 bg-rose-50 rounded-xl border border-rose-200 text-rose-950 font-bold">
                    🔴 [우선 개선] Slide 3 열폭주 위험 질문 시 구체적 BMS 안전 수치 보완 필요
                  </div>
                  <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-amber-950 font-bold">
                    🟡 [보완 권장] Slide 5 건식 공정 설명 시 기존 습식 설비 전환 비용 언급 추가
                  </div>
                  <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-emerald-950 font-bold">
                    🟢 [잘하고 있음] 7분 15초로 권장 발표 시간을 완벽히 준수함
                  </div>
                </div>
                <button onClick={() => setShowModal(false)} className="stripe-pill-btn w-full justify-center">확인 완료</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- View 8: Settings ---
    function SettingsView({ showToast }) {
      return (
        <div className="space-y-6 max-w-2xl">
          <h1 className="text-xl font-black text-slate-900">⚙️ 환경 설정</h1>
          <div className="stripe-card p-6 space-y-4 bg-white">
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">Google Gemini API Key (선택 사항)</label>
              <input type="password" placeholder="AIzaSy..." className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-mono" />
              <p className="text-[11px] text-slate-500 mt-1">※ 키가 없어도 내장 스마트 AI 엔진이 기본으로 100% 동작합니다.</p>
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">사용자 이름</label>
              <input type="text" defaultValue="이예서" className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold text-slate-900" />
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">대학교</label>
              <input type="text" defaultValue="한국대학교 3학년" className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold text-slate-900" />
            </div>
            <button onClick={() => showToast('설정 저장', '설정이 성공적으로 저장되었습니다.')} className="stripe-pill-btn">저장하기</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
