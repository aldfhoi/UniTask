              <div className="p-3 bg-amber-50 rounded-xl text-xs font-medium text-amber-950 border border-amber-200">
                ⚠️ <strong>감점 방지 주의사항:</strong> 참고문헌 7개 이상 필수 인용, 표절 검사 감점 유의

                        <select value={t.status} onChange={(e) => setTasks(tasks.map(item => item.id === t.id ? { ...item, status: e.target.value } : item))} className="bg-slate-50 border rounded px-1">

                          <option value="in_progress">In Progress</option>

                      </div>

    function ResourcesView({ resources, showToast }) {

              <p className="text-xs text-slate-600 mt-1">팀원들이 업로드한 논문과 PDF를 분석하여 중복을 감지하고 최적의 목차를 추천합니다.</p>

            <button onClick={() => showToast('자료 업로드', '새 학술 자료가 등록되었습니다.')} className="stripe-pill-btn">

            💡 <strong>AI 권장:</strong> 김민준 팀원은 실험 물성 데이터에, 박서현 팀원은 공정 단가 절감 효과로 분담하는 것을 추천합니다.
          </div>

            {resources.map(r => (
              <div key={r.id} className="stripe-card p-5 flex flex-col justify-between">
                <div>
                  <span className="text-[10px] font-bold px-2 py-0.5 bg-slate-100 rounded text-slate-700">{r.fileType.toUpperCase()}</span>

                  <p className="text-[11px] text-slate-500 mt-0.5">업로더: {r.uploaderName} · {r.uploadDate}</p>

                  </div>
                </div>
                <div className="mt-4 pt-2 border-t border-slate-100 text-[11px] text-emerald-700 font-bold">
                  추천 챕터: {r.matchedSection}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AssistantView({ project, resources }) {
      const [messages, setMessages] = useState([
        { sender: 'ai', text: `안녕하세요 이예서님! [${project.title}] 프로젝트 AI 튜터입니다. 업로드된 자료 3건과 과제 지침을 기반으로 무엇이든 질문하세요.` }
      ]);
      const [input, setInput] = useState('');

      const send = () => {
        if (!input.trim()) return;
        const newMsgs = [...messages, { sender: 'user', text: input }];
        setMessages(newMsgs);
        setInput('');

        setTimeout(() => {
          setMessages([...newMsgs, {
            sender: 'ai',
            text: `업로드된 [${resources.map(r => r.title).join(', ')}] 자료를 분석한 결과, 서론의 문제 정의와 본론의 하이니켈 열화 메커니즘 분석이 매우 우수합니다.\n\n추가로 폐배터리 리사이클링 및 2026 완성차 양산 적용 사례를 1~2문장 보강하시면 A+ 과제가 됩니다.`
          }]);
        }, 500);
      };

      return (
        <div className="space-y-4">
          <h1 className="text-xl font-black text-slate-900">🤖 프로젝트 전용 AI 어시스턴트</h1>
          <div className="stripe-card p-5 h-[380px] overflow-y-auto space-y-3">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`p-3.5 rounded-2xl max-w-xl text-xs leading-relaxed ${m.sender === 'user' ? 'bg-slate-900 text-white font-medium' : 'bg-slate-100 text-slate-900 font-medium'}`}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="과제에 관해 무엇이든 물어보세요..." className="flex-1 p-3 bg-white border border-slate-200 rounded-xl text-xs" />
            <button onClick={send} className="stripe-pill-btn">전송</button>
          </div>
        </div>
      );
    }

            ))}

      );

      return (

              <h1 className="text-xl font-black text-slate-900">🏆 AI 실전 발표 연습 & 6대 지표 평가</h1>

              <div className="flex justify-between pt-4">
                <button disabled={slideIdx === 0} onClick={() => setSlideIdx(slideIdx - 1)} className="px-3 py-1.5 rounded-xl border text-xs font-bold">이전</button>

              </div>
            </div>

            <div className="lg:col-span-5 stripe-card p-6 space-y-3">
              <span className="text-xs font-bold px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded">👨‍🏫 교수님 돌발 질문 모드</span>

              </div>
              <textarea rows={4} placeholder="답변을 입력하거나 말씀하세요..." className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs"></textarea>
              <button onClick={() => showToast('답변 기록', '교수님 질문 답변이 저장되었습니다.')} className="stripe-pill-btn w-full justify-center">답변 제출</button>
            </div>
          </div>

          {showModal && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full space-y-4 shadow-2xl">

                <div className="p-3 bg-emerald-50 rounded-xl text-xs font-bold text-emerald-800">

                </div>
                <div className="space-y-1.5 text-xs">
                  <p className="text-rose-700 font-bold">🔴 [우선 개선] Slide 3 열폭주 위험 질문 시 구체적 BMS 안전 수치 보완 필요</p>
                  <p className="text-emerald-700 font-bold">🟢 [잘하고 있음] 7분 15초로 권장 발표 시간을 완벽히 준수함</p>
                </div>
                <button onClick={() => setShowModal(false)} className="stripe-pill-btn w-full justify-center">확인 완료</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SettingsView({ showToast }) {

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
